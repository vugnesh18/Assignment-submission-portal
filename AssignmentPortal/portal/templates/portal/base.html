{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Assignment Portal</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* General body styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
        }

        /* Navbar styling */
        .navbar {
            background-color: #2c3e50; /* Dark blue */
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .navbar a {
            color: #ecf0f1; /* Light gray */
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar a:hover {
            background-color: #3498db; /* Bright blue */
            color: #fff; /* White */
        }

        /* Container styling */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff; /* White */
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            min-height: 80vh; /* Ensure container takes up space */
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar a {
                margin: 10px 0;
            }

            .container {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Logout</a>
            {% if user.is_staff %}
                <a href="{% url 'teacher_dashboard' %}">Dashboard</a> <!-- Updated URL name -->
            {% else %}
                <a href="{% url 'student_dashboard' %}">Dashboard</a> <!-- Updated URL name -->
            {% endif %}
        {% endif %}
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
