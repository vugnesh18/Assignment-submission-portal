{% extends 'portal/base.html' %}
{% block content %}
    <style>
        /* General content styling */
        h1 {
            text-align: center;
            color: #4a235a; /* Deep plum */
            margin: 20px 0;
            font-size: 32px;
        }

        /* Form styling */
        form {
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            background-color: #f5f5dc; /* Light cream */
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        form p {
            margin: 15px 0;
            color: #6b3e7a; /* Muted purple */
        }

        form input[type="text"],
        form textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #2e7d32; /* Forest green */
            border-radius: 5px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        form input[type="submit"] {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #2e7d32; /* Forest green */
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form input[type="submit"]:hover {
            background-color: #4caf50; /* Lighter green */
        }
    </style>

    <h1>Create Assignment</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Create">
    </form>
{% endblock %}
